# Operator unit suite only. Never executes untrusted submission/skill code.
# No production secrets. Bounded timeout. contents:read only.
name: ProSkills Operator tests

on:
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/proskills-operator-tests.yml"
      - ".github/workflows/proskills-intake.yml"
      - ".github/workflows/proskills-publish.yml"
      - ".github/workflows/proskills-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: operator-unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROSKILLS_ENV: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run operator unit tests
        run: cd operator && python3 -m unittest discover -s tests -v

      - name: Assert no production Oracle env configured
        run: |
          # Names only — never print values.
          failed=0
          for name in ORACLE_URL ORACLE_ENDPOINT ORACLE_TOKEN ORACLE_API_KEY ORACLE_HMAC_SECRET PROSKILLS_ORACLE_URL PROSKILLS_ORACLE_TOKEN; do
            eval "is_set=\${$name+yes}"
            if [ "$is_set" = "yes" ]; then
              eval "len=\${#$name}"
              if [ "$len" -gt 0 ]; then
                echo "Unexpected production Oracle variable is configured: $name"
                failed=1
              fi
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No production Oracle variables configured (names checked only)"

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint (pinned release, checksum verified)
        env:
          AL_VERSION: "1.7.12"
          AL_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSfL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
