# Daily ProSkills pipeline health (read-only): candidate/review label counts, publish PRs, published today,
# live catalog total, last intake/publish workflow runs. Writes the GitHub job summary only.
name: ProSkills health

on:
  schedule:
    - cron: "1 3 * * *"   # 03:01 UTC == 09:01 Asia/Dhaka (UTC+6)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proskills-health
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: operator/scripts/actions_guard.py
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          PROSKILLS_ACTIONS_ENABLED: ${{ vars.PROSKILLS_ACTIONS_ENABLED }}
          HAS_APP_ID: ${{ secrets.PROSKILLS_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.PROSKILLS_APP_PRIVATE_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 operator/scripts/actions_guard.py

  health:
    name: daily health summary
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # list recent intake/publish workflow runs
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROSKILLS_APP_ID }}
          private-key: ${{ secrets.PROSKILLS_APP_PRIVATE_KEY }}
          owner: ProSkillsMD
          repositories: proskills,website
          permission-issues: read
          permission-pull-requests: read
          permission-metadata: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Health report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNS_TOKEN: ${{ github.token }}
        run: python3 operator/scripts/actions_health.py report >> "$GITHUB_STEP_SUMMARY"
